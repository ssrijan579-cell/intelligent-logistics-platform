[project]
name = "intelligent-logistics-platform"
version = "0.1.0"
description = "AI-powered delivery delay prediction and logistics intelligence platform."
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.10",
    "numpy>=2.0",
    "pandas>=2.0",
    "scikit-learn>=1.9",
    "seaborn>=0.13",
    "joblib>=1.3",
]

[tool.black]
line-length = 88

[tool.isort]
profile = "black"

[tool.pytest.ini_options]
testpaths = ["tests"]